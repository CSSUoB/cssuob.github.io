<section class="sponsor-block">
  <h2>{{ include.title | default: site.data.sponsors.title | escape }}</h2>
  <ul class="sponsor-block__list">
    {% for sponsor in site.data.sponsors.sponsors %}
    <li class="sponsor-block__sponsor">
      <h3 class="sponsor-block__tier sponsor-block__tier--{{ sponsor.tier }}">
        {{ sponsor.tier | capitalize }}
      </h3>
      <div class="sponsor-block__logo">
        <img
          src="{{ sponsor.logo | relative_url }}"
          alt="{{ sponsor.name | escape }}"
          loading="lazy"
          width="220"
          height="110"
        />
      </div>
    </li>
    {% endfor %}
  </ul>
</section>
