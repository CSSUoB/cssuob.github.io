welcome:
  heading: "👋 WELCOME TO FRESHERS 2026!"
  body: |-
    You made it - welcome to the University of Birmingham!

    Starting university is a big change — new people, a new city and probably a lot of new names to remember. That’s where CSS comes in. We’re here to help make Birmingham feel like home and give you a community outside of lectures from the moment you arrive.

    Freshers is one of the best times to get involved. Throughout the year, you’ll have plenty of opportunities to meet your coursemates, make friends, try something new and take a break from studying. From socials and quizzes to workshops, hackathons, careers events and our annual CSS Ball, there’s something for everyone — and you definitely don’t need to be a coding expert to join in.

    Your first few weeks can feel overwhelming, so don’t worry if you don’t know anyone yet. Come along to an event, introduce yourself in the Discord or just say hello when you see us around campus. Everyone was a fresher once!

    Keep an eye on our socials and community channels for everything we have planned for Freshers and beyond.

    We can’t wait to meet you. Welcome to CSS! 💜

about:
  heading: Who are we?
  body: |-
    CSS is the University of Birmingham’s Computer Science Society: a welcoming community created by students, for students. You do not need to be an experienced programmer — or even study Computer Science — to get involved.

    We are part of the Guild of Students and are led by an elected student committee. Our activities are supported by membership fees, income from ticketed events and partnerships with sponsors, with that support invested back into the society and its members.
  link_text: Learn more about CSS
  link_url: /about
  cards:
    - icon: "🗳️"
      title: Run by students
      body: An elected committee organises the society, represents members and shapes what CSS does each year.
      link_text: Meet the committee
      link_url: /committee
    - icon: "🤝"
      title: How we are supported
      body: Memberships, ticketed events and sponsor partnerships help us fund activities and opportunities for members.
      link_text: See our sponsors
      link_url: /sponsor
    - icon: "🎉"
      title: Socials and community
      body: We run games nights, meals, quizzes, trips, pub nights and our annual CSS Ball.
      link_text: Explore our events
      link_url: /events
    - icon: "💡"
      title: Skills and careers
      body: Expect workshops, hackathons, projects, industry talks, careers panels and opportunities to try something new.
      link_text: Visit BirmingHack
      link_url: https://birminghack.com
