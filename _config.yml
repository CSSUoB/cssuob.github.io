future: false
plugins:
  - jekyll-feed
  - jekyll-seo-tag

title: UoB Computer Science Society
description: The Computer Science Society at the University of Birmingham. 🎉🎉
url: cssbham.com
social:
  name: CSS
  links:
    - https://twitter.com/CSSBham
    - https://github.com/CSSUoB
freshers_banner:
  enabled: true
  link: /freshers
  image: /assets/images/freshers-2026/freshers-week-2026-lockup.png
menu:
  - name: FRESHERS
    link: /freshers
    class: freshers-nav
    image: /assets/images/freshers-2026/freshers-week-2026-lockup.png
    image_alt: Freshers Week
  - name: Events
    link: /events
  - name: News
    link: /newsletter
  - name: Sponsor
    link: /sponsor
  - name: Committee
    link: /committee
  - name: Society
    children:
      - name: About
        link: /about
      - name: Merch
        link: /merch
      - name: Community Links
        link: /links

  - name: Join CSS
    link: /membership
    class: join-nav
baseurl: /
root: /

collections_dir: _collections/
collections:
  news:
    output: true
    permalink: /newsletter/:title
  merch:
    output: true
    permalink: /merch/:slug
  clubs:
  events:
    sort_by: order
  freshers_events:
    output: false
    sort_by: date

feed:
  collections:
    news:
      path: "/newsletter/feed.xml"

include: ["_redirects"]
keep_files: ["_redirects"]
