name: PR auto-setup

# pull_request_target gives fork PRs access to the App secrets. This is safe only
# because no step checks out or runs code from the PR.
on:
  pull_request_target:
    types: [opened, ready_for_review]
    branches: [main]

# The job uses the GitHub App token, not GITHUB_TOKEN
permissions: {}

jobs:
  pr-auto-setup:
    name: Label and enable auto-merge
    runs-on: ubuntu-latest
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PR_AUTO_UPDATE_CLIENT_ID }}
          private-key: ${{ secrets.PR_AUTO_UPDATE_PRIVATE_KEY }}

      # Only for branches in this repo; bots such as Dependabot rebase their own PRs
      - name: Add sync label
        if: >-
          github.event.action == 'opened'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.type != 'Bot'
        run: gh pr edit "$PR_URL" --add-label sync
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}

      - name: Enable auto-merge
        if: ${{ !github.event.pull_request.draft }}
        run: gh pr merge "$PR_URL" --auto --squash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
