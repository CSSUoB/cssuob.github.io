name: Static analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-analysis:
    name: Format, lint and spellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Check formatting
        if: ${{ !cancelled() }}
        run: npm run format

      - name: Lint JavaScript
        if: ${{ !cancelled() }}
        run: npm run lint:js

      - name: Lint Markdown
        if: ${{ !cancelled() }}
        run: npm run lint:md

      - name: Spellcheck changed files
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          git diff --name-only --diff-filter=d HEAD^ HEAD -- '*.md' '*.html' \
            | npx cspell --file-list stdin --no-must-find-files --no-progress \
              --issue-template '::warning file=$filename,line=$row,col=$col::Unknown word: $text'
