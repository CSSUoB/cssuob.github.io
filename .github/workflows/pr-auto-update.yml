name: PR auto-update

on:
  push:
    branches: [main]

# The job uses the GitHub App token, not GITHUB_TOKEN
permissions: {}

# Queue rather than cancel, so an update is never stopped part way through
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  pr-auto-update:
    name: Update PRs labelled sync
    runs-on: ubuntu-latest
    # Dependabot-triggered runs can't read the App secrets
    if: github.repository == 'CSSUoB/cssuob.github.io' && github.actor != 'dependabot[bot]'
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PR_AUTO_UPDATE_CLIENT_ID }}
          private-key: ${{ secrets.PR_AUTO_UPDATE_PRIVATE_KEY }}

      - name: Update PRs labelled sync
        uses: CSSUoB/pr-auto-updater@v4.0.0
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_FILTER: labelled
          PR_LABELS: sync
          MERGE_CONFLICT_ACTION: label
          MERGE_CONFLICT_LABEL: conflict
