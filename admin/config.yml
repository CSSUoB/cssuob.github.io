backend:
  name: github
  repo: CSSUoB/cssuob.github.io
  branch: master

publish_mode: editorial_workflow

media_folder: "assets/images/"

collections:
  - name: "freshers_page"
    label: "Freshers Page"
    files:
      - label: "Freshers Page Settings"
        name: "freshers_page_settings"
        file: "_data/freshers.yml"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - label: "Background Image"
                name: "background_image"
                widget: "image"
                allow_multiple: false
              - label: "Introduction"
                name: "intro"
                widget: "text"
          - label: "Countdown"
            name: "countdown"
            widget: "object"
            fields:
              - label: "Date"
                name: "date"
                widget: "datetime"
                date_format: "DD MMM YYYY"
                time_format: false
                format: "YYYY-MM-DD"
                hint: "The countdown disappears at the start of this date."
          - label: "Events Section"
            name: "events"
            widget: "object"
            fields:
              - label: "Heading"
                name: "heading"
                widget: "string"
              - label: "Introduction"
                name: "introduction"
                widget: "text"
              - label: "Calendar Heading"
                name: "calendar_heading"
                widget: "string"
              - label: "Calendar Image"
                name: "calendar_image"
                widget: "image"
                allow_multiple: false
              - label: "Calendar Image Description"
                name: "calendar_image_alt"
                widget: "string"
                hint: "Describe the calendar for people using screen readers."
          - label: "Welcome Section"
            name: "welcome"
            widget: "object"
            fields:
              - label: "Heading"
                name: "heading"
                widget: "string"
              - label: "Text"
                name: "body"
                widget: "markdown"
          - label: "What Are We Section"
            name: "about"
            widget: "object"
            fields:
              - label: "Heading"
                name: "heading"
                widget: "string"
              - label: "Introduction"
                name: "body"
                widget: "markdown"
              - label: "Link Text"
                name: "link_text"
                widget: "string"
              - label: "Link URL"
                name: "link_url"
                widget: "string"
              - label: "Information Cards"
                name: "cards"
                widget: "list"
                min: 1
                summary: "{{fields.title}}"
                fields:
                  - label: "Title"
                    name: "title"
                    widget: "string"
                  - label: "Text"
                    name: "body"
                    widget: "text"
                  - label: "Link Text"
                    name: "link_text"
                    widget: "string"
                  - label: "Link URL"
                    name: "link_url"
                    widget: "string"
          - label: "FAQs Section"
            name: "faq"
            widget: "object"
            fields:
              - label: "Heading"
                name: "heading"
                widget: "string"
              - label: "Questions"
                name: "items"
                widget: "list"
                min: 1
                summary: "{{fields.question}}"
                fields:
                  - label: "Question"
                    name: "question"
                    widget: "string"
                  - label: "Answer"
                    name: "answer"
                    widget: "text"

  - name: "pages"
    label: "Pages"
    folder: "/"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Layout"
        name: "layout"
        widget: "hidden"
        default: "textpage"
      - label: "Title"
        name: "title"
        widget: "string"
      - label: "Body"
        name: "body"
        widget: "markdown"

  - name: "newsletter"
    label: "Newsletter"
    folder: "_collections/_news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - label: "Layout"
        name: "layout"
        widget: "hidden"
        default: "post"
      - label: "Published"
        name: "published"
        widget: "hidden"
        default: true
      - label: "Title"
        name: "title"
        widget: "string"
      - label: "Thumbnail"
        name: "thumbnail"
        widget: "image"
        allow_multiple: false
      - label: "Header Image"
        name: "header-image"
        widget: "image"
        allow_multiple: false
      - label: "Body"
        name: "body"
        widget: "markdown"

  - name: "clubs"
    label: "Clubs"
    folder: "_collections/_clubs"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
      - label: "Header Image"
        name: "header-image"
        widget: "image"
        allow_multiple: false
      - label: "Body"
        name: "body"
        widget: "markdown"

  - name: "freshers_events"
    label: "Freshers Events"
    label_singular: "Freshers Event"
    folder: "_collections/_freshers_events"
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: ["date", "title"]
    summary: "{{title}} — {{date}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
      - label: "Cover Image"
        name: "cover_image"
        widget: "image"
        allow_multiple: false
      - label: "Image Description"
        name: "image_alt"
        widget: "string"
        hint: "Describe the image for people using screen readers."
      - label: "Event Description"
        name: "description"
        widget: "text"
        hint: "A short paragraph shown on the event card."
      - label: "Location"
        name: "location"
        widget: "string"
      - label: "Date (for sorting)"
        name: "date"
        widget: "datetime"
        date_format: "DD MMM YYYY"
        time_format: false
        format: "YYYY-MM-DD"
        hint: "Used to put events in chronological order."
      - label: "Date shown on event"
        name: "display_date"
        widget: "string"
        required: false
        hint: "Shown exactly as entered. For example, 21 Sep 2026 or 21–25 Sep 2026."
      - label: "Start Time"
        name: "start_time"
        widget: "string"
        hint: "For example, 18:30."
      - label: "End Time"
        name: "end_time"
        widget: "string"
        required: false
        hint: "Optional. For example, 21:00."
